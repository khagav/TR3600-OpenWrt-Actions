name: Build Cudy TR3600 OpenWrt Pure

# =============================================================================
# TR3600 build kit — OpenWrt 功能版 + 性能優化（目前唯一的建置線）
#
# 2026-10-13：iStore 應用商店已移除（連同 linkease/istore feed 與其依賴），
#   iStore 版建置線整個退休。主題用 OpenWrt 原生 bootstrap。
#   第一輪是「只裝智能風扇」的精簡版；同日晚間第二輪加回 VPN / 組網 / 代理 /
#   下載 / 共享 / DDNS 一整組。
#
# 2026-11-12（Lite 重建）：實機連續自動重啟、pstore 查不到 panic 之後，這條線
#   退回「穩定優先」：砍掉全部常駐用戶態應用（zerotier / openvpn / mosdns /
#   aria2 / samba4 / webdav / ddns-scripts / ddns-go / minidlna / stubby /
#   miniupnpd），只留 tailscale + wireguard；同時**移除第三方 feed（kenzok8）**，
#   建置線只依賴 OpenWrt 官方 feed。另加 3 條穩定化措施：
#     * 刪掉 tr3600-4g-wwatch 看門狗（無 dongle 時每分鐘強制 USB 重插）
#     * 刪掉 04:30 每日定時重啟 cron（把真崩潰蓋掉了）
#     * pci=noaer + RAM 末端 1 MiB ramoops（讓下次 panic 留得下來）
#   WED 同時在 /etc/modprobe.d/mt7996e.conf 明確關閉。
#
# 基底： openwrt-25.12 + Cudy TR3600 v1 板级支援（上游 PR #24596，尚未合併）
#        實際 clone 來源見下面的 env.REPO_URL（編譯必需，非品牌標記）
# 修正： patches/0001-tr3600-fan-pwm0.patch          (風扇 PWM 通道 1 -> 0)
#        patches/0002-mt76-mt7996-sta-rec-before-vow.patch (mt76 STA_REC/VoW 順序)
#        patches/0003-luci-tr3600-fan-keep-pending-input.patch (LuCI 風扇頁 dirty flag)
#        patches/0004-tr3600-led-colours.patch       (LED: GPIO48 白 / GPIO46 紅)
#        patches/0005-tr3600-wifi-mac-layout.patch   (WiFi MAC: 2.4G=base+0, 5G=base+0x10)
#        patches/0006-tr3600-fan-thermal-curve.patch (溫控: 60C 以下停轉, 65/75/85 三段)
#        patches/0007-tr3600-fan-curve-tune.patch    (風扇曲線調校: 50/78/100%, 68/78/88C)
#        patches/0008-tr3600-usb-stability.patch    (USB3 端口屏蔽 + USB3 PHY 關閉)
#        patches/0009-tr3600-noaer-ramoops.patch    (bootargs pci=noaer + ramoops 1 MiB)
#
# 已下線： patches/0008-luci-tr3600-fan-smart-suggestions.patch
#        （風扇頁智能季節建議）—— 2026-10-13 移除，補丁留在 retired/patches/。
#        它把「內核 step_wise 本來就會做的事」在用戶態又重做一遍（季節曲線 +
#        日曆 + 待機基準），只是多一層會壞的東西，還讓 UI 變得難懂。
#        風扇頁現在只有 auto / manual 兩種模式。
# 設定： mt7987-cudy-tr3600-pure.config
# 性能： sysctl fq + BBR、TCP 緩衝區加大、HWNAT 硬體流量卸載、WED 明確關閉（穩定優先）
#
# 守門機制（一個都不少）：
#   1. Clone 後印出實際 HEAD SHA 並與 REPO_COMMIT 比對（只警告、不中斷）。
#   2. 「Download Packages」之後多一個 mt76 patch 預檢：backport 打不上去
#      就在編譯前失敗，不會白等 2~3 小時。
#   3. diy-pure-part2.sh 對 0001/0004/0005/0006/0007 五個 DTS patch 都做
#      dry-run + 套用後複查，任何一個不生效就 exit 1。
#   4. 風扇插件內建於 vendor/，不 clone 任何第三方倉庫（精簡版連回退 clone 都
#      沒有：vendor/ 不見就直接失敗）。part1 之後會確認套件存在且腳本 0755，
#      複查 0003（dirty flag）套上了，**反向斷言 0008 沒有跑回來**
#      （風扇頁只該有 auto / manual；季節機制一旦出現就 exit 1），
#      並斷言模組名仍是「智能風扇」（menu.d title + 頁面 h2，中英文一致）。
#   5. Release / Artifact 只發佈白名單檔案：mediatek/filogic 目錄裡混著
#      mt7981/mt7986/mt7987/mt7988 的 *-ram-*-bl2.bin（**別顆晶片**的 BL2
#      RAM loader），刷錯就是磚，一律不發佈。
#   6. 軟體源鏡像 + sysctl 調校：diy-pure-part1.sh 把倉庫的 files/ 複製成
#      openwrt/files/，由 include/image.mk 的 prepare_rootfs 蓋進 rootfs。
#      (a) 把 apk 源從 downloads.openwrt.org 換成 mirror.sjtu.edu.cn（國內快 ~30 倍）；
#      (b) 交付 /etc/sysctl.d/99-tr3600-pure.conf（fq + BBR、TCP 16 MB、conntrack）——
#          **不能**放 /etc/sysctl.conf，那是 conffile，被 sysupgrade 保留會蓋掉新映像的。
#      part1 之後先確認兩份檔案就位，編譯後再從 build_dir 的 staging rootfs 複查成品。
#   7. oldconfig 之後斷言必需包仍為 =y：kmod-sched（sch_fq）、wpad-mbedtls（802.11r/k/v）、
#      USB 儲存/網卡/共享，以及 Lite 版留下的組網套件（tailscale / kmod-wireguard）。
#      並確認 wpad-basic-mbedtls 已被換掉。feed 裡沒有 kmod，事後補不了，
#      只能編譯期保證。
#      **daemon 也要斷言，不只 LuCI 前端**（rpcd-mod-wireguard）——
#      否則「菜單在、點進去空的」。
#      同時反向斷言：被砍掉的應用（aria2 / samba4 / mosdns / openvpn / ddns /
#      minidlna / stubby / miniupnpd / zerotier）**不准**偷偷回到 .config。
#   8. 第三方 feed：Lite 版**一個都不要**。part1 之後斷言 feeds.conf.default
#      裡沒有 kenzok8；有就失敗。這條以前是反向的（要求那兩行存在），
#      現在改成防呆，免得老分支的設定被默默帶進來。
# =============================================================================

on:
  # 2026-11-12: 加 push 觸發，讓「改 config/patches → 推送 → 自動出固件」不用再
  # 依賴手動 workflow_dispatch（本機的 gh 沒有 token，dispatch 走不通）。
  # 只認 main 分支；workflow 自己 push 的 tag 不會回頭再觸發一次。
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  DEVICE_NAME: Cudy-TR3600
  DEVICE_MODEL: Cudy TR3600
  FIRMWARE_PREFIX: Cudy-TR3600-Lite
  # 上游原始碼位置。編譯必需，但它是「實作細節」不是品牌：
  # 所有對外輸出（release tag / 標題 / 說明 / README）都不再引用這個名字。
  REPO_URL: https://github.com/soapmancn/openwrt
  REPO_BRANCH: agent/cudy-tr3600-v1-6.12
  # 2026-08-11 head of the branch above; used only as a reference for the
  # warning below (the branch itself is what actually gets built).
  REPO_COMMIT: 046aec0dccd9
  # 配置文件路径（相对于仓库根目录）
  CONFIG_FILE: mt7987-cudy-tr3600-pure.config
  DIY_P1_SH: diy-pure-part1.sh
  DIY_P2_SH: diy-pure-part2.sh
  DIY_P3_SH: diy-partX.sh
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
    # =========================================================
    # 1. 检出仓库
    # =========================================================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # =========================================================
    # 2. 释放磁盘空间 & 安装依赖
    # =========================================================
    - name: Free Disk Space & Install Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm
        sudo docker image prune --all --force

        sudo swapoff -a && sudo rm -f /mnt/swapfile
        sudo fallocate -l 8G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile

        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential libncurses5-dev gawk \
          git subversion libssl-dev gettext unzip zlib1g-dev file python3 \
          clang llvm dwarves flex bison dos2unix patch

        sudo timedatectl set-timezone "$TZ"

        echo "磁盘空间:"
        df -hT
        echo "内存/Swap:"
        free -h

    # =========================================================
    # 3. 克隆源码
    # =========================================================
    - name: Clone Source Code
      run: |
        git clone -b "$REPO_BRANCH" --single-branch --depth=1 "$REPO_URL" openwrt
        cd openwrt
        HEAD_SHA=$(git rev-parse --short=12 HEAD)
        echo "分支 $REPO_BRANCH 的 HEAD = $HEAD_SHA"
        if [ "$HEAD_SHA" != "$REPO_COMMIT" ]; then
          echo "::warning title=上游分支已移動::分支 HEAD ($HEAD_SHA) 與建置時驗證的 $REPO_COMMIT 不同。patch 預檢步驟會把關。"
        fi

    # =========================================================
    # 4. 执行 DIY 脚本 (diy-pure-part1.sh)
    # =========================================================
    - name: Execute diy-pure-part1.sh
      run: |
        cd openwrt
        if [ -f "../$DIY_P1_SH" ]; then
          echo "📜 执行脚本: $DIY_P1_SH"
          cp "../$DIY_P1_SH" ./
          chmod +x "$DIY_P1_SH"
          ./"$DIY_P1_SH"
        else
          echo "::error title=脚本缺失::$DIY_P1_SH 不存在"; exit 1
        fi

        # ---- TR3600 build kit guard: 风扇插件必须就位且可执行 ----
        # 这一步把「静默产出 0644 脚本 -> 上机后 exec_direct EACCES ->
        # LuCI 显示未检测到风扇」这个原始症状，提前变成编译期的硬失败。
        FANPKG=package/custom/luci-app-tr3600-fan
        if [ ! -f "$FANPKG/Makefile" ]; then
          echo "::error title=风扇插件缺失::$FANPKG/Makefile 不存在，diy-pure-part1.sh 没装成功。"
          ls -la package/custom 2>/dev/null || true
          exit 1
        fi
        for f in "$FANPKG/root/usr/sbin/tr3600-fan" \
                 "$FANPKG/root/etc/init.d/tr3600-fan" \
                 "$FANPKG/root/etc/uci-defaults/99-tr3600-fan"; do
          if [ ! -f "$f" ]; then
            echo "::error title=风扇插件文件缺失::找不到 $f"; exit 1
          fi
          m=$(stat -c %a "$f")
          echo "  $f  mode=$m"
          if [ "$m" != "755" ]; then
            echo "::error title=风扇脚本权限不对::$f 是 $m，应为 755（否则设备上 exec_direct 会 EACCES）"
            exit 1
          fi
        done
        grep -qF "if (!dirty) {" "$FANPKG/htdocs/luci-static/resources/view/tr3600-fan.js" \
          || echo "::warning title=0003 未套用::LuCI 风扇页 dirty flag 补丁没生效（非致命）"

        # ---- 0008（智能季节建议）已于 2026-10-13 下线 ----
        # 风扇页现在只有 auto / manual 两种模式。这里是**反向断言**：季节
        # 机制不该出现在固件里。哪天有人把 0008 加回来，这一步会直接失败。
        for pat in 'season_trips' 'set_smart' 'SEASON_TRIPS' 'Smart suggestion'; do
          if grep -qF "$pat" "$FANPKG/root/usr/sbin/tr3600-fan" \
               "$FANPKG/htdocs/luci-static/resources/view/tr3600-fan.js" 2>/dev/null; then
            echo "::error title=0008 又跑回来了::固件里出现「$pat」，风扇页应该只有 auto / manual"
            exit 1
          fi
        done
        if grep -qF "option season" "$FANPKG/root/etc/config/tr3600-fan"; then
          echo "::error title=0008 又跑回来了::/etc/config/tr3600-fan 出现了 season 选项"
          exit 1
        fi
        echo "✅ 风扇页精简：只有 auto / manual，无季节机制"

        # ---- 第三方 feed：Lite 版不允许存在 ----
        # 2026-11-12 起，这条检查是**反向**的：以前要求 kenzok8 两个 feed 存在
        # （为了 mosdns / ddns-go / webdav），现在这三个套件都砍了，第三方 feed
        # 必须一行都没有。若老分支的 feeds.conf.default 被带进来，这里立刻失败，
        # 而不是让 duplicate package / oldconfig 吃符号在半小时后才爆。
        FEEDSCONF=feeds.conf.default
        if [ ! -f "$FEEDSCONF" ]; then
          echo "::error title=找不到 feeds.conf.default::cwd 应该已经在 openwrt 根目录"; exit 1
        fi
        if grep -q 'kenzok8' "$FEEDSCONF"; then
          echo "::error title=出现第三方 feed::Lite 版只允许 OpenWrt 官方 feed，但 feeds.conf.default 里有 kenzok8"
          cat "$FEEDSCONF"
          exit 1
        fi
        echo "✅ 只有 OpenWrt 官方 feed（无第三方）"

        # ---- 模块名：智能风扇（2026-10-13 改名） ----
        # menu.d 的 title 与页面 h2 用同一个字面量「智能风扇」，po 目录里也有
        # 同名条目（msgid == msgstr）。这样中英文模式都会显示「智能风扇」：
        # 中文模式查到条目返回自身，英文模式没有 en 目录，回退到 msgid 也是自身。
        if ! grep -qF '"title": "智能风扇"' "$FANPKG/root/usr/share/luci/menu.d/luci-app-tr3600-fan.json"; then
          echo "::error title=模块名被改动::menu.d 的 title 不是「智能风扇」"
          exit 1
        fi
        if ! grep -qF "智能风扇" "$FANPKG/htdocs/luci-static/resources/view/tr3600-fan.js"; then
          echo "::error title=模块名被改动::风扇页 h2 不是「智能风扇」"
          exit 1
        fi
        if grep -qF 'TR3600 Fan Control' "$FANPKG/htdocs/luci-static/resources/view/tr3600-fan.js" \
           "$FANPKG/root/usr/share/luci/menu.d/luci-app-tr3600-fan.json" 2>/dev/null; then
          echo "::error title=旧模块名残留::风扇模块还留着 TR3600 Fan Control"
          exit 1
        fi
        echo "✅ 模块名：智能风扇（中英文模式一致）"

        echo "✅ 风扇插件就位：$FANPKG（脚本 0755）"

        # ---- 软件源镜像：必须是 SJTU，不能退回 downloads.openwrt.org ----
        # 官方源在国内慢到不可用（实测 14 KB 的索引要 9.75 s ≈ 1.5 KB/s）。
        # diy-pure-part1.sh 会把仓库里的 files/ 复制成 openwrt/files/，由
        # include/image.mk 的 prepare_rootfs 盖进 rootfs。这里只确认它到位；
        # 真正进固件后的复查在下面 Dump build evidence 那一步。
        FEEDLIST=files/etc/apk/repositories.d/distfeeds.list
        if [ ! -f "$FEEDLIST" ]; then
          echo "::error title=软件源镜像缺失::$FEEDLIST 不存在，diy-pure-part1.sh 没把 files/ 复制进来。"
          exit 1
        fi
        if ! grep -q "mirror.sjtu.edu.cn" "$FEEDLIST"; then
          echo "::error title=软件源镜像没生效::$FEEDLIST 里没有 mirror.sjtu.edu.cn。"
          cat "$FEEDLIST"
          exit 1
        fi
        if grep -q "downloads.openwrt.org" "$FEEDLIST"; then
          echo "::error title=软件源镜像残留官方源::$FEEDLIST 里还有 downloads.openwrt.org"
          exit 1
        fi
        echo "✅ 软件源镜像：mirror.sjtu.edu.cn（$(grep -c . "$FEEDLIST") 条）"

        # ---- sysctl 调校：必须走 files/etc/sysctl.d/，不能回退 /etc/sysctl.conf ----
        # /etc/sysctl.conf 是 conffile，被 /lib/upgrade/keep.d/base-files-essential 保留，
        # sysupgrade 后旧机上的那份会盖掉新映像的 → 调校永远不生效（实测 rmem_max 停在 208 KB）。
        # /etc/sysctl.d/ 不被保留，所以调校一律放这里。
        SYSCTLD=files/etc/sysctl.d/99-tr3600-pure.conf
        if [ ! -f "$SYSCTLD" ]; then
          echo "::error title=sysctl 调校缺失::$SYSCTLD 不存在，性能调校不会进固件。"
          exit 1
        fi
        if ! grep -q "default_qdisc=fq" "$SYSCTLD"; then
          echo "::error title=sysctl 调校缺失::$SYSCTLD 里没有 default_qdisc=fq"; exit 1
        fi
        if ! grep -q "rmem_max=16777216" "$SYSCTLD"; then
          echo "::error title=sysctl 调校缺失::$SYSCTLD 里没有 16 MB 缓冲区"; exit 1
        fi
        echo "✅ sysctl 调校：$SYSCTLD（fq + BBR + 16 MB 缓冲区）"

        # ---- 纯淨版守门：确认没有任何第三方插件被偷偷 clone 进来 ----
        if [ -d package/custom ]; then
          echo "📦 package/custom 内容（应该只有风扇插件）:"
          ls -1 package/custom
          EXTRA=$(ls -1 package/custom | grep -v '^luci-app-tr3600-fan$' || true)
          if [ -n "$EXTRA" ]; then
            echo "::warning title=非预期插件::package/custom 里还有: $EXTRA"
          fi
        fi

    # =========================================================
    # 5. 更新 & 安装 Feeds
    # =========================================================
    - name: Update & Install Feeds
      run: |
        cd openwrt
        # 2026-11-12 Lite：只用 OpenWrt 官方 feed（第三方 feed 已移除）。
        # 网络抖动会让 feeds update 失败，所以重试 3 次再放弃。
        ok=0
        for i in 1 2 3; do
          echo "--- feeds update -a (attempt $i) ---"
          if ./scripts/feeds update -a; then ok=1; break; fi
          sleep 15
        done
        if [ "$ok" != "1" ]; then
          echo "::error title=feeds update 失败::官方 feed 拉不下来（网络问题，重试 3 次仍失败）"
          exit 1
        fi
        # 只有官方 feed，不会有同名套件冲突；install -a 之后的 WARNING 才值得看。
        ./scripts/feeds install -a

    # =========================================================
    # 6. 执行 DIY 脚本 (diy-pure-part2.sh)
    #    ← 這裡會套用風扇 DTS、mt76 backport 與性能優化
    # =========================================================
    - name: Execute diy-pure-part2.sh
      run: |
        cd openwrt
        if [ -f "../$DIY_P2_SH" ]; then
          echo "📜 执行脚本: $DIY_P2_SH"
          cp "../$DIY_P2_SH" ./
          chmod +x "$DIY_P2_SH"
          ./"$DIY_P2_SH"
        else
          echo "::error title=脚本缺失::$DIY_P2_SH 不存在"; exit 1
        fi

    # =========================================================
    # 7. 复制配置文件 (使用 CONFIG_FILE)
    # =========================================================
    - name: Copy Config File
      run: |
        cd openwrt
        if [ -f "../$CONFIG_FILE" ]; then
          echo "📋 使用配置文件: $CONFIG_FILE"
          cp "../$CONFIG_FILE" .config
          echo "✅ 配置文件已复制到 .config"
        else
          echo "❌ 配置文件不存在: $CONFIG_FILE"
          exit 1
        fi
        echo "========================================"
        echo "📋 配置摘要:"
        grep "CONFIG_TARGET_DEVICE" .config || echo "⚠️ 未找到设备配置"
        grep -E "CONFIG_DEFAULT_THEME|CONFIG_PACKAGE_luci-app-tr3600-fan" .config || true
        echo "========================================"

    # =========================================================
    # 8. oldconfig 保留自定义勾选，禁止 make defconfig
    # =========================================================
    - name: Generate Oldconfig
      run: |
        cd openwrt
        make oldconfig
        echo "✅ oldconfig 生成完成"
        # 校验风扇插件仍然 =y
        echo "==== fan config check ===="
        grep -E "luci-app-tr3600-fan|luci-theme-bootstrap|CONFIG_DEFAULT_THEME" .config
        echo "============================"
        # Lite 版：商店 / 主题类插件一个都不该出现
        # ⚠️ 2026-11-12：passwall2 / mosdns 这一批已经整组砍掉，不再「要装」，
        #    它们由下面的「不许出现的包」反向断言单独检查。
        echo "==== 应为空（不该出现的插件）===="
        grep -E "CONFIG_PACKAGE_(luci-app-store|luci-app-passwall|luci-app-openclash|luci-app-ssr-plus|luci-theme-argon|luci-theme-aurora|luci-theme-kucat|luci-app-smartdns|luci-app-openlist|luci-app-ttyd|luci-app-filemanager|luci-app-authshield)=y" .config \
          && { echo "::error title=混入非预期插件::上面这些插件不该出现在 config 里"; exit 1; } \
          || echo "OK: 没有混入非预期插件"
        echo "========================================"

        # ---- 必须存在的包（oldconfig 之后仍为 y）----
        # 2026-11-12 Lite：清单按「路由器本职」收缩。
        #   留下：fq 排程、完整 wpad、USB 存储/网卡（USB-LAN / 4G dongle 要用）、
        #         IPv6、组网（tailscale / wireguard）。
        #   砍掉：zerotier / openvpn / aria2 / samba4 / ddns / mosdns / minidlna /
        #         stubby / miniupnpd —— 它们不再编进固件，断言也要跟着删。
        # 少了任何一个都会在设备上表现为「功能不存在」，而且 feed 里没有 kmod
        # 可以事后补装 —— 只能在编译期保证。
        #
        # ⚠️ **同时断言 daemon，不只断言 LuCI 前端**。只断言前端的话，万一依赖
        #   名写错或 feed 缺包，会出现「菜单在、点进去空的」—— 前端装上了、
        #   daemon 没装上，而且这里一声不响。
        echo "==== 必须 =y 的包 ===="
        MISSING=""
        for sym in \
          CONFIG_PACKAGE_kmod-sched \
          CONFIG_PACKAGE_wpad-mbedtls \
          CONFIG_PACKAGE_kmod-usb-storage \
          CONFIG_PACKAGE_kmod-usb-storage-uas \
          CONFIG_PACKAGE_kmod-fs-ext4 \
          CONFIG_PACKAGE_kmod-fs-exfat \
          CONFIG_PACKAGE_block-mount \
          CONFIG_PACKAGE_kmod-usb-net \
          CONFIG_PACKAGE_kmod-usb-net-rtl8152 \
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179 \
          CONFIG_PACKAGE_kmod-usb-net-aqc111 \
          CONFIG_PACKAGE_kmod-usb-net-rndis \
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm \
          CONFIG_PACKAGE_kmod-usb-net-ipheth \
          CONFIG_PACKAGE_tailscale \
          CONFIG_PACKAGE_luci-app-tailscale-community \
          CONFIG_PACKAGE_kmod-wireguard \
          CONFIG_PACKAGE_wireguard-tools \
          CONFIG_PACKAGE_luci-proto-wireguard \
          CONFIG_PACKAGE_rpcd-mod-wireguard \
          CONFIG_PACKAGE_odhcpd-ipv6only \
          CONFIG_PACKAGE_luci-app-tr3600-fan \
        ; do
          if grep -q "^${sym}=y" .config; then
            echo "  [OK] $sym"
          else
            echo "  [MISS] $sym"
            MISSING="$MISSING $sym"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo "::error title=必需包没进 config::这些包在 oldconfig 后不是 =y:$MISSING"
          exit 1
        fi
        # wpad-basic-mbedtls 必须被换掉（缺 802.11r/k/v 与 WPS）
        if grep -q "^CONFIG_PACKAGE_wpad-basic-mbedtls=y" .config; then
          echo "::error title=wpad 没换::wpad-basic-mbedtls 仍为 =y，缺 802.11r/k/v 与 WPS"
          exit 1
        fi
        echo "✅ 必需包齐全（22 项：fq 排程 / wpad-mbedtls / USB / IPv6 / tailscale / wireguard / 风扇）"

        # ---- 反向断言：Lite 砍掉的包不许回来 ----
        # oldconfig 会把 =y 变成 not set 或反之，也可能被某个默认包重新拖进来。
        # 这些套件全是常驻用户态服务，回到固件里就等于这次重建白做。
        echo "==== 不许出现的包 ===="
        CAME_BACK=""
        for pkg in aria2 samba4-server mosdns ddns-go openvpn-openssl zerotier \
                   minidlna stubby miniupnpd-nftables luci-app-mosdns \
                   luci-app-ddns-go luci-app-webdav luci-app-samba4 \
                   luci-app-openvpn luci-app-ddns luci-app-minidlna; do
          if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
            echo "  [BACK] CONFIG_PACKAGE_${pkg}=y"
            CAME_BACK="$CAME_BACK $pkg"
          fi
        done
        if [ -n "$CAME_BACK" ]; then
          echo "::error title=砍掉的包又回来了::Lite 版不该包含:$CAME_BACK"
          exit 1
        fi
        echo "✅ 已砍套件确认不在 config 里（16 项）"
        echo "========================================"

    # =========================================================
    # 9. 执行 DIY 脚本 (diy-partX.sh)
    # =========================================================
    - name: Execute diy-partX.sh
      run: |
        cd openwrt
        if [ -f "../$DIY_P3_SH" ]; then
          echo "📜 执行脚本: $DIY_P3_SH"
          cp "../$DIY_P3_SH" ./
          chmod +x "$DIY_P3_SH"
          ./"$DIY_P3_SH"
        else
          echo "⚠️ 跳过: $DIY_P3_SH (文件不存在)"
        fi

    # =========================================================
    # 10. SSH 调试（可选）
    # =========================================================
    - name: SSH Debug Session
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true'

    # =========================================================
    # 11. 下载软件包
    # =========================================================
    - name: Download Packages
      run: |
        cd openwrt
        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec rm -f {} \;

    # =========================================================
    # 11b. mt76 backport 預檢
    #      在真正編譯前，先把已下載的 mt76 原始碼解開、乾跑一次 patch。
    #      打不上去就立刻失敗，不會白等 2~3 小時才發現。
    # =========================================================
    - name: Verify mt76 backport applies
      run: |
        set -e
        cd openwrt
        MT76_TARBALL="$(find dl -maxdepth 1 -name 'mt76-*.tar.*' | head -1)"
        if [ -z "$MT76_TARBALL" ]; then
          echo "❌ 找不到 mt76 原始碼壓縮檔 (dl/mt76-*.tar.*)"
          ls -la dl | head -40
          exit 1
        fi
        echo "📦 $MT76_TARBALL"

        rm -rf /tmp/mt76check && mkdir -p /tmp/mt76check
        tar -xf "$MT76_TARBALL" -C /tmp/mt76check
        SRC="$(find /tmp/mt76check -maxdepth 1 -mindepth 1 -type d | head -1)"
        echo "📂 $SRC"

        echo "--- mt7996_mcu_add_sta() 附近 ---"
        grep -n "mt7996_mcu_add_group" "$SRC/mt7996/mcu.c" || true

        cd "$SRC"
        echo "--- dry-run 套用 backport ---"
        patch -p1 --dry-run --forward < "$GITHUB_WORKSPACE/patches/0002-mt76-mt7996-sta-rec-before-vow.patch"
        echo "✅ mt76 backport 可正常套用"

    # =========================================================
    # 12. 编译固件
    # =========================================================
    - name: Compile Firmware
      id: compile
      run: |
        cd openwrt

        echo "🔨 开始编译... (分步：-j2 → -j1)"

        # 2026-11-12: 以前用 make -j"$(nproc)"（标准 runner 4 vCPU / 16 GB）。
        # 上一轮就是这么被 OOM 杀掉整个 make 的：日志停在 package/install
        # 中间，一声不响。这里改成**固定 -j2**，宁可慢 30 分钟也不要半路
        # 被内核 OOM killer 拿走；仍然失败才退到 -j1。
        if make -j2; then
          echo "✅ -j2 编译成功"
        elif make -j1; then
          echo "✅ -j1 编译成功"
        elif make -j1 V=s; then
          echo "✅ -j1 V=s 编译成功"
        else
          echo "❌ 编译失败"
          exit 1
        fi

        echo "status=success" >> "$GITHUB_OUTPUT"
        BUILD_TIMESTAMP=$(date +"%Y%m%d-%H%M")
        echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> "$GITHUB_ENV"

        echo "========================================"
        echo "✅ 固件编译完成"
        echo "📅 编译时间: $(date '+%Y-%m-%d %H:%M:%S')"
        df -hT /
        echo "========================================"

    # =========================================================
    # 13. 整理固件文件
    # =========================================================
    - name: Organize Firmware Files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE_DIR=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "📦 固件文件列表:"
        ls -lah

        # -----------------------------------------------------------------
        # 只挑出「這台機器」的產物另外放一份，避免別顆晶片的 bootloader 被發佈。
        # mediatek/filogic 的 bin 目錄裡會混進 mt7981/mt7986/mt7987/mt7988 的
        # *-ram-*-bl2.bin —— 那些是「別顆晶片」的 BL2 RAM loader。
        # -----------------------------------------------------------------
        RELEASE_DIR="$PWD/release"
        rm -rf "$RELEASE_DIR"
        mkdir -p "$RELEASE_DIR"

        shopt -s nullglob
        for f in *cudy_tr3600-v1-squashfs-sysupgrade.bin \
                 *cudy_tr3600-v1-initramfs-kernel.bin \
                 *.manifest sha256sums; do
          [ -f "$f" ] || continue
          cp -a "$f" "$RELEASE_DIR/"
        done
        shopt -u nullglob

        SYSUP=$(ls -1 "$RELEASE_DIR"/*cudy_tr3600-v1-squashfs-sysupgrade.bin 2>/dev/null | head -1)
        if [ -z "$SYSUP" ]; then
          echo "::error title=缺少 sysupgrade 映像::在 $PWD 找不到 *cudy_tr3600-v1-squashfs-sysupgrade.bin，不產出 Release。"
          exit 1
        fi

        echo "FIRMWARE_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

        echo
        echo "✅ 將發佈的檔案（只有這些）:"
        ls -lah "$RELEASE_DIR"

        echo
        echo "⛔ 以下檔案是別顆晶片的 bootloader，一律不發佈（刷了會磚）:"
        shopt -s nullglob
        STRAY=(*-ram-*-bl2.bin)
        shopt -u nullglob
        if [ ${#STRAY[@]} -eq 0 ]; then
          echo "   （沒有）"
        else
          for f in "${STRAY[@]}"; do echo "   $f"; done
        fi

    # =========================================================
    # 13b. 把關鍵修正的證據存成 log artifact
    # =========================================================
    - name: Dump build evidence
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        {
          echo "=== openwrt HEAD ==="
          git -C openwrt rev-parse HEAD
          echo
          echo "=== fan DTS pwm lines ==="
          grep -nE 'pwms = <&pwm|pinctrl-0 = <&pwm' \
            openwrt/target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts
          echo
          echo "=== LED colours (expect led-0=white@48, led-1=red@46) ==="
          grep -nE 'led_status_(white|red): led-[01]|color = |gpios = <&pio 4[68]|function = LED_FUNCTION' \
            openwrt/target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts
          echo
          echo "=== WiFi MAC layout (expect band@0 -> 0, band@1 -> 16) ==="
          grep -nE 'nvmem-cells = <&macaddr_bdinfo_de00' \
            openwrt/target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts
          echo
          echo "=== fan curve (expect cooling-levels 0 128 200 255 / trips 68/78/88 C) ==="
          grep -nE 'cooling-levels|active-(low|med|high)|temperature = <(6[08]000|78000|88000)>' \
            openwrt/target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts
          echo
          echo "=== performance tuning (expect fq + bbr) ==="
          grep -nE 'default_qdisc|tcp_congestion_control|rmem_max|wmem_max' \
            openwrt/package/base-files/files/etc/sysctl.conf || echo "(none)"
          echo
          echo "=== uci-defaults installed ==="
          ls -la openwrt/package/base-files/files/etc/uci-defaults/ 2>/dev/null || echo "(none)"
          echo
          echo "=== mt76 patches installed ==="
          ls -la openwrt/package/kernel/mt76/patches/ 2>/dev/null || echo "(none)"
          echo
          echo "=== mt76 PKG_SOURCE_VERSION ==="
          sed -n 's/^PKG_SOURCE_VERSION:=//p' openwrt/package/kernel/mt76/Makefile
          echo
          echo "=== patched mt7996_mcu_add_sta tail (STA_REC must precede VoW) ==="
          # 注意：不能用 awk '/^out:/{p=1}'，那會抓到檔案裡「第一個」out: 標籤
          # （mt7996_debugfs_rx_log 之類），不是 add_sta 的。必須先把函式體框出來。
          MCU=openwrt/build_dir/target-*/linux-*/mt76-*/mt7996/mcu.c
          for f in $MCU; do
            [ -f "$f" ] || continue
            echo "  -- $f"
            awk '
              /^(static[ \t]+)?(int|void)[ \t]+.*mt7996_mcu_add_sta\(/ { infn = 1; n = 0 }
              infn { buf[++n] = $0 }
              infn && /^}/ { for (i = 1; i <= n; i++) print buf[i]; exit }
            ' "$f" | tail -28
            S=$(awk '/^(static[ \t]+)?(int|void)[ \t]+.*mt7996_mcu_add_sta\(/{infn=1} infn&&/STA_REC_UPDATE/{print NR; exit}' "$f")
            G=$(awk '/^(static[ \t]+)?(int|void)[ \t]+.*mt7996_mcu_add_sta\(/{infn=1} infn&&/mt7996_mcu_add_group\(/{print NR; exit}' "$f")
            if [ -n "$S" ] && [ -n "$G" ] && [ "$S" -lt "$G" ]; then
              echo "  [OK] STA_REC_UPDATE (line $S) is sent before mt7996_mcu_add_group (line $G)"
            else
              echo "  [FAIL] wrong ordering: STA_REC_UPDATE=${S:-none} mt7996_mcu_add_group=${G:-none}"
              exit 1
            fi
          done
          echo
          echo "=== tr3600-fan file modes in built rootfs ==="
          find openwrt/build_dir -path '*luci-app-tr3600-fan*' -name 'tr3600-fan' -exec ls -l {} \; 2>/dev/null || true
          echo
          echo "=== tr3600-fan package provenance (sha256 of the source tree used) ==="
          find openwrt/package/custom/luci-app-tr3600-fan -type f \
            -exec sha256sum {} \; 2>/dev/null | sort -k2 || true
          echo
          echo "=== tr3600-fan entry-point modes (must be 755) ==="
          ls -l openwrt/package/custom/luci-app-tr3600-fan/root/usr/sbin/tr3600-fan \
                openwrt/package/custom/luci-app-tr3600-fan/root/etc/init.d/tr3600-fan \
                openwrt/package/custom/luci-app-tr3600-fan/root/etc/uci-defaults/99-tr3600-fan \
            2>/dev/null || true
          echo
          echo "=== 纯净版检查：package/custom 里应该只有风扇插件 ==="
          ls -1 openwrt/package/custom 2>/dev/null || echo "(none)"
          echo
          echo "=== 软件源镜像（固件里真正生效的那份）==="
          # files/ 是 rootfs overlay，由 include/image.mk 的 prepare_rootfs 复制进
          # 各文件系统的 staging 目录。这里直接看 staging 里的成品，确认 overlay
          # 真的盖掉了 base-files 生成的官方源。
          FOUND=0
          for f in $(find openwrt/build_dir -path '*root-*/etc/apk/repositories.d/distfeeds.list' 2>/dev/null); do
            FOUND=1
            echo "  -- $f"
            cat "$f" | sed 's/^/     /'
            if ! grep -q "mirror.sjtu.edu.cn" "$f"; then
              echo "  [FAIL] 这份不是 SJTU 镜像"
              exit 1
            fi
            if grep -q "downloads.openwrt.org" "$f"; then
              echo "  [FAIL] 这份还指向 downloads.openwrt.org"
              exit 1
            fi
            echo "  [OK] 指向 mirror.sjtu.edu.cn"
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "::error title=找不到固件里的 distfeeds.list::files/ overlay 可能没被复制进 rootfs"
            exit 1
          fi

          echo
          echo "=== sysctl 调校（固件里真正生效的那份）==="
          # 同一个 overlay 也交付 /etc/sysctl.d/99-tr3600-pure.conf。这里复查 staging
          # 里确实有这份，而且没有退回被 sysupgrade 保留的 /etc/sysctl.conf。
          FOUND_SYSCTL=0
          for f in $(find openwrt/build_dir -path '*root-*/etc/sysctl.d/99-tr3600-pure.conf' 2>/dev/null); do
            FOUND_SYSCTL=1
            echo "  -- $f"
            cat "$f" | sed 's/^/     /'
            if ! grep -q "default_qdisc=fq" "$f"; then
              echo "  [FAIL] 这份没有 default_qdisc=fq"; exit 1
            fi
            if ! grep -q "rmem_max=16777216" "$f"; then
              echo "  [FAIL] 这份没有 16 MB 缓冲区"; exit 1
            fi
            echo "  [OK] fq + BBR + 16 MB 缓冲区"
          done
          if [ "$FOUND_SYSCTL" -eq 0 ]; then
            echo "::error title=找不到固件里的 sysctl 调校::files/ overlay 可能没被复制进 rootfs"
            exit 1
          fi

          echo
          echo "=== 稳定性（2026-11-12 Lite）：wwatch 必须不在 / wed_enable=0 必须在 ==="
          # 1) 4G 看门狗已从仓库删除，成品里不该有它的任何痕迹。
          WW=$(find openwrt/build_dir -path '*root-*/usr/sbin/tr3600-4g-wwatch' 2>/dev/null)
          WI=$(find openwrt/build_dir -path '*root-*/etc/init.d/tr3600-4g-wwatch' 2>/dev/null)
          if [ -n "$WW$WI" ]; then
            echo "  [FAIL] 成品里还有 wwatch: $WW $WI"
            exit 1
          fi
          echo "  [OK] tr3600-4g-wwatch 不在成品里（脚本 + init.d 都没有）"
          # 2) WED 必须被 modprobe.d 明确关掉。
          FOUND_MOD=0
          for f in $(find openwrt/build_dir -path '*root-*/etc/modprobe.d/mt7996e.conf' 2>/dev/null); do
            FOUND_MOD=1
            echo "  -- $f"
            cat "$f" | sed 's/^/     /'
            grep -q 'wed_enable=0' "$f" || { echo "  [FAIL] 没有 wed_enable=0"; exit 1; }
            echo "  [OK] wed_enable=0"
          done
          [ "$FOUND_MOD" -eq 1 ] || { echo "  [FAIL] 成品里没有 /etc/modprobe.d/mt7996e.conf"; exit 1; }
          # 3) 定时重启不许回来。
          for f in $(find openwrt/build_dir -path '*root-*/etc/crontabs/root' 2>/dev/null); do
            if grep -q 'reboot' "$f"; then
              echo "  [FAIL] crontab 里还有 reboot: $(grep reboot "$f")"
              exit 1
            fi
            echo "  [OK] crontab 无 reboot"
          done
          echo "  [OK] 无每日定时重启 cron"
          # 4) DTS 的 noaer / ramoops 断言（patch 之后再看一遍，防止被后续 patch 盖掉）。
          grep -qF 'pci=noaer' openwrt/target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts \
            || { echo "  [FAIL] DTS bootargs 没有 pci=noaer"; exit 1; }
          grep -qF 'compatible = "ramoops";' openwrt/target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts \
            || { echo "  [FAIL] DTS 没有 ramoops 节点"; exit 1; }
          echo "  [OK] DTS: pci=noaer + ramoops"
        } > build-evidence.txt 2>&1
        cat build-evidence.txt

    - name: Upload build evidence
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        name: build-evidence-pure-${{ env.BUILD_TIMESTAMP }}
        path: build-evidence.txt

    # =========================================================
    # 14. 上传固件到 Artifacts
    # =========================================================
    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.DEVICE_NAME }}-Lite-${{ env.BUILD_TIMESTAMP }}
        # 只上傳白名單目錄，別顆晶片的 *-ram-*-bl2.bin 不會進 artifact
        path: ${{ env.FIRMWARE_RELEASE_DIR }}

    # =========================================================
    # 15. 生成 Release Tag 和说明
    # =========================================================
    - name: Generate Release Tag and Notes
      id: tag
      if: success() && !cancelled()
      run: |
        BUILD_TIME="$BUILD_TIMESTAMP"
        DEVICE="$DEVICE_NAME"

        # 對外標籤只留「設備 + 版本線 + 時間」，不帶品牌、上游作者與分支名。
        RELEASE_TAG="${DEVICE}-Lite-${BUILD_TIME}"
        RELEASE_TAG=$(echo "$RELEASE_TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')

        # 固件号：人一眼能认出这一版是哪一个构建
        FIRMWARE_NO="Lite-${BUILD_TIME}-r${{ github.run_number }}"

        echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
        echo "firmware_no=${FIRMWARE_NO}" >> "$GITHUB_OUTPUT"

        cat <<EOF > release.txt
        ## Cudy TR3600 v1 — OpenWrt 固件（Lite 稳定版）

        **固件号**：\`${FIRMWARE_NO}\` ｜ **编译时间**：$(date '+%Y-%m-%d %H:%M:%S') (Asia/Shanghai)
        **构建基底**：\`openwrt-25.12\` + Cudy TR3600 v1 板级支持 ｜ **配置文件**：\`${{ env.CONFIG_FILE }}\`
        **主題**：OpenWrt 原生 **bootstrap**（LuCI 中文界面）

        ### 📦 內含外掛

        | 類別 | 套件 |
        |------|------|
        | 風扇 | **TR3600 智能風扇**（內建於 \`vendor/\`，不依賴第三方倉庫） |
        | 組網 | Tailscale（含 LuCI）、WireGuard（kmod + 工具 + LuCI 協定頁） |
        | USB | 儲存（ext4 / exfat / ntfs3 + block-mount）、約 11 種網卡晶片、手機共享（RNDIS / NCM / EEM）、WWAN（QMI / MBIM）、4 種 USB 序列埠 |
        | 無線 | \`wpad-mbedtls\`（含 **802.11r/k/v 快速漫遊** 與 WPS） |

        > **这一版是「稳定优先」的 Lite 版（2026-11-12 重建）**：砍掉了全部常驻
        > 用户态应用 —— aria2、Samba4、WebDAV、mosdns、DDNS（ddns-scripts /
        > ddns-go）、OpenVPN、ZeroTier、minidlna、stubby、miniupnpd。
        > 原因：实机连续自动重启且 pstore 查不到 panic，而这批服务是 512 MB
        > 内存下最可能的 OOM / 卡死来源。路由器本职（拨号 / NAT / WiFi / SSH /
        > mesh）一个都没少。要用某个功能，LuCI → 软件套件页 \`apk add\` 即可。

        > **第三方 feed（kenzok8）已整个移除**：本版所有套件都来自 OpenWrt
        > 官方 feed + 本仓库内建风扇插件，建置不再依赖任何会漂移的外部 feed。

        ### ⚡ 性能優化

        > 這些全部由 \`/etc/sysctl.d/99-tr3600-pure.conf\` 交付（**不是** \`/etc/sysctl.conf\`
        > —— 那是 conffile，sysupgrade 會保留舊的、蓋掉新映像的設定）。

        - ✅ **BBR + fq**：\`net.ipv4.tcp_congestion_control=bbr\`、\`net.core.default_qdisc=fq\`
        - ✅ **TCP 緩衝區**：rmem/wmem 上限 16 MB（2.5G WAN 高頻寬下不卡吞吐）
        - ✅ **硬體流量卸載（HWNAT）**：\`flow_offloading\` + \`flow_offloading_hw\` 預設開啟，
          轉發幾乎不吃 CPU（要用 SQM 記得關掉）
        - ❌ **WED 無線卸載：明確關閉**（\`/etc/modprobe.d/mt7996e.conf\` →
          \`options mt7996e wed_enable=0\`）。WED 是跨 PCIe 傳 DMA 描述符的路徑，
          一次 AER 錯誤就是吞吐崩塌或 panic；原廠 Cudy 固件同樣不開。
        - ✅ **zram**：壓縮記憶體當 swap，記憶體吃緊時不 OOM

        ### 🔧 板級修正
        - ✅ **風扇 PWM**：DTS 由 PWM 通道 1 → **通道 0**（\`pwms = <&pwm 0 50000 0>\`），
          \`pinctrl-0\` 改為 \`pwm_pins\`，風扇測得到、可調速
        - ✅ **風扇腳本權限**：\`/usr/sbin/tr3600-fan\`、\`/etc/init.d/tr3600-fan\` 由 0644 → 0755
          （否則 \`exec_direct\` EACCES，LuCI 顯示「未檢測到風扇」）
        - ✅ **風扇曲線調校**：待機 **停轉**，68 / 78 / 88 °C 三段 50 % / 78 % / 100 %
          （原本 65 °C 那段的 25 % 實測完全沒有降溫效果，已改成有效的 50 %）
        - ✅ **LED 顏色**：\`led-0\` = **白**@GPIO48、\`led-1\` = **紅**@GPIO46（本板**無藍燈**）
        - ✅ **WiFi MAC**：2.4 GHz = **base+0x00**、5 GHz = **base+0x10**（與廠商一致）
        - ✅ **無線**：mt76 \`mt7996_mcu_add_sta()\` 改為先送 STA_REC、後送 VoW/DRR
          （修正 \`wifi down/up\` 後客戶端再也連不上的問題）
        - ✅ **風扇插件已內建**於倉庫 \`vendor/luci-app-tr3600-fan\`，不依賴第三方倉庫

        ### 🩺 稳定性（本版重点，2026-11-12）

        上一版实机表现为「分钟级自动重启」，而 `pstore` 里永远空空如也 ——
        既没有 panic 记录，也没有能对上的 dmesg。这一版针对「症状」和
        「看不见症状」两件事一起动手：

        - 🗑️ **删除 `tr3600-4g-wwatch` 看门狗**：它每分钟检查 4G tether，
          没插 dongle 时会 `forcing usb replug`，对整个 USB root hub 反复
          断电重插。已从镜像里彻底移除（不是禁用），配置里残留的
          `tr3600.wwatch.*` 不会再有任何代码去读。
        - 🗑️ **删除 04:30 每日定时重启**：它把真正的崩溃掩盖了（uptime 永远
          不超过一天，看起来一切正常），还可能在升级中途触发。
        - ✅ **`pci=noaer` 进 bootargs**：MT7990 的 PCIe 链路出 AER
          `synchronous external abort` 时，恢复路径会走到 panic。报告这里
          没有任何用处，直接不报告。
        - ✅ **`pstore`/`ramoops`（1 MiB，DRAM 末端）**：真的再崩，下一次开机
          就能在 `/sys/fs/pstore` 里看到上次的 console + panic。这是这次重建
          唯一「以后能查」的东西。
        - ✅ **WED 明确关闭**（见上），与原厂 Cudy 固件一致。
        - ✅ **只留官方 feed**：第三方 feed 漂移是过去编译失败的主因，现在
          整条建置线不再有外部依赖。

        > 如果刷完仍然重启：先看 `/sys/fs/pstore/` 有没有 `console-ramoops-0`，
        > 那里面就是这次的真正原因。没有的话，说明复位来自硬件/看门狗
        > （PMIC、BL31、外部复位），优先级应该转到电源与 USB 负载上。

        ### 📥 刷機

        | 文件 | 用途 |
        |------|------|
        | ✅ \`openwrt-mediatek-filogic-cudy_tr3600-v1-squashfs-sysupgrade.bin\` | **要刷的就是这个** |
        | 🧯 \`openwrt-mediatek-filogic-cudy_tr3600-v1-initramfs-kernel.bin\` | 救援 / 救砖用（内存启动） |
        | 📄 \`openwrt-mediatek-filogic.manifest\` | 套件清单，**不是固件，不要刷** |

        1. 下载上面那个 \`…cudy_tr3600-v1-squashfs-sysupgrade.bin\`
        2. 通过 Cudy 过渡中间固件后 WEB 网页后台或 U-Boot 刷入
        3. 默认 IP \`192.168.6.1\`、默认密码 \`password\`
        4. 刷完進 LuCI 會看到 **bootstrap** 主題（OpenWrt 原生）

        > ⚠️ **本 Release 只包含 TR3600 自己的两个映像 + manifest。**
        > 早期版本会误把 \`mt7981-ram-*-bl2.bin\`、\`mt7986-ram-*-bl2.bin\`、
        > \`mt7987-ram-comb-bl2.bin\`、\`mt7988-ram-*-bl2.bin\` 一起挂上来 ——
        > 那些是**别颗芯片**的 BL2 RAM loader，刷进 TR3600 会**直接变砖**。
        > 如果你在旧 Release 里看到它们，**绝对不要碰**。

        > ⚠️ 刷机有风险，请谨慎操作；建议刷机前备份原厂固件。本固件仅供学习研究使用。
        EOF

        echo "status=success" >> "$GITHUB_OUTPUT"

    # =========================================================
    # 16. 创建 GitHub Release 并上传固件
    # =========================================================
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2.3.2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: ${{ env.DEVICE_MODEL }} OpenWrt Pure 功能性能版 - ${{ env.BUILD_TIMESTAMP }}
        body_path: release.txt
        # 只發佈 Organize 步驟挑出來的白名單檔案。
        files: |
          ${{ env.FIRMWARE_RELEASE_DIR }}/*
        draft: false
        prerelease: false

    # =========================================================
    # 17. 清理旧的 Releases（保留最近 10 个）
    #    注意 pattern 只匹配 Pure 線（現在唯一的建置線）。
    #    iStore 版建置線已於 2026-10-13 退休，其殘留的 Release / tag 已手動刪除。
    #    刻意「不寫結尾的連字號」：這樣連早期 ...-Pure-Ajay-* 的舊標籤也一併納入汰換，
    #    否則品牌拿掉之後，那些舊標籤會永遠留在 Releases 頁面上沒人清。
    # =========================================================
    - name: Remove Old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: success() && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
        delete_tag_pattern: "^${{ env.DEVICE_NAME }}-Lite"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
