# Cudy TR3600 v1 — mt7996e (MT7990 5 GHz/6 GHz) module options
#
# wed_enable=0
#   Wireless Ethernet Dispatch (hardware RX ring offload for RRO).
#   In mt76 today this is off unless explicitly enabled (`static bool
#   wed_enable;`, mt7996/mmio.c), so this file is a *pin*, not a change of
#   current behaviour: it stops a future upstream default flip (or a vendor
#   patch that turns WED on) from silently switching it on for this board.
#   Why pin it off here: the WED path is what hands DMA descriptors across
#   the MT7990 PCIe link, and a single AER error there means either a silent
#   throughput collapse or a "synchronous external abort" that ends in a
#   panic. The stock Cudy firmware also runs with WED off.
#
#   Cost: some CPU on 802.11ax throughput (MT7987 has 4x Cortex-A53, plenty).
#
# To re-enable later for a benchmark, boot with:
#   mt7996e.wed_enable=1 on the kernel cmdline, or remove this file.
options mt7996e wed_enable=0
